<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<title>Weather</title>
<style>
:root {
  color-scheme: light dark;
  font-family: "Segoe UI", sans-serif;
  letter-spacing: 0;
  --text: #202124;
  --muted: #5f6368;
  --line: rgba(32, 33, 36, .14);
  --surface: rgba(255, 255, 255, .58);
  --surface-strong: rgba(255, 255, 255, .82);
  --blue: #286fa8;
  --cyan: #0d7f88;
  --green: #347a43;
  --amber: #9a6500;
  --orange: #b64b1a;
  --red: #b3261e;
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; height: 100%; min-height: 100%; background: transparent; overflow: hidden; }
body { color: var(--text); }
button, input, select, textarea { font: inherit; }
a { color: inherit; }
#weather { width: 100%; height: 100%; min-height: 353px; padding: 16px 20px 11px; overflow-x: hidden; overflow-y: auto; }
.muted { color: var(--muted); }
.location-row { display: flex; align-items: center; min-width: 0; gap: 8px; }
.location-mark { width: 9px; height: 9px; flex: 0 0 auto; border-radius: 50%; background: var(--red); }
.location { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 18px; font-weight: 600; }
.resolved { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
.provider-state { margin-left: auto; flex: 0 0 auto; font-size: 11px; color: var(--muted); }
.provider-state.warning { color: var(--orange); font-weight: 600; }
.current-grid { display: grid; grid-template-columns: 92px minmax(130px, 1fr) minmax(155px, auto); align-items: center; column-gap: 14px; margin-top: 12px; }
#current-icon { width: 92px; height: 92px; }
.temperature { font-size: 52px; line-height: 1; font-weight: 650; white-space: nowrap; }
.temperature small { margin-left: 3px; vertical-align: top; font-size: 23px; font-weight: 500; }
.condition-wrap { min-width: 0; text-align: right; }
.condition { font-size: 20px; font-weight: 600; overflow-wrap: anywhere; }
.updated { margin-top: 5px; font-size: 11px; }
.details { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 1px; margin-top: 10px; border: 1px solid var(--line); background: var(--line); }
.detail { min-width: 0; padding: 7px 7px 6px; background: var(--surface-strong); text-align: center; }
.detail-label { display: block; font-size: 10px; color: var(--muted); white-space: nowrap; }
.detail-value { display: block; margin-top: 1px; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.section { padding-top: 11px; }
.section + .section { margin-top: 11px; border-top: 1px solid var(--line); }
.section-title-row { display: flex; align-items: baseline; gap: 8px; margin-bottom: 7px; }
.section-title { font-size: 13px; font-weight: 650; }
.section-note { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; color: var(--muted); }
.alerts { display: grid; gap: 6px; padding-top: 10px; }
.alert { border: 1px solid rgba(179, 38, 30, .35); border-left: 4px solid var(--alert-color, var(--red)); background: rgba(179, 38, 30, .07); }
.alert summary { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 8px; min-height: 34px; padding: 6px 8px; cursor: pointer; list-style: none; }
.alert summary::-webkit-details-marker { display: none; }
.alert-level { padding: 2px 5px; border-radius: 4px; color: #fff; background: var(--alert-color, var(--red)); font-size: 10px; font-weight: 700; }
.alert-title { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; font-weight: 650; }
.alert-time { font-size: 10px; color: var(--muted); white-space: nowrap; }
.alert-body { max-height: 210px; overflow: auto; padding: 1px 10px 9px 43px; font-size: 11px; line-height: 1.55; }
.alert-meta { margin-bottom: 5px; color: var(--muted); }
.alert-block + .alert-block { margin-top: 7px; }
.alert-block strong { display: block; margin-bottom: 2px; font-size: 10px; color: var(--muted); }
.minute-summary { font-size: 12px; font-weight: 600; }
.minute-chart { display: grid; grid-template-columns: repeat(24, minmax(0, 1fr)); align-items: end; gap: 2px; height: 48px; margin-top: 7px; padding-top: 4px; border-bottom: 1px solid var(--line); }
.minute-bar { min-height: 2px; background: var(--blue); }
.minute-axis { display: grid; grid-template-columns: repeat(5, 1fr); margin-top: 3px; font-size: 9px; color: var(--muted); }
.minute-axis span:nth-child(2), .minute-axis span:nth-child(3), .minute-axis span:nth-child(4) { text-align: center; }
.minute-axis span:last-child { text-align: right; }
.hourly { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); grid-auto-rows: 76px; gap: 4px 2px; }
.hour { min-width: 0; height: 76px; padding: 2px 0; text-align: center; }
.hour-time, .hour-temp, .hour-prob { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hour-time { font-size: 10px; }
.hour canvas { display: block; width: 27px; height: 27px; margin: 1px auto 0; }
.hour-temp { font-size: 10px; color: var(--muted); }
.hour-prob { margin-top: 1px; font-size: 11px; font-weight: 650; color: var(--blue); }
.air-grid { display: grid; grid-template-columns: 100px 1fr; gap: 12px; align-items: center; }
.aqi-main { border-right: 1px solid var(--line); text-align: center; }
.aqi-value { font-size: 30px; line-height: 1; font-weight: 700; }
.aqi-category { margin-top: 3px; font-size: 11px; font-weight: 600; }
.pollutants { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 5px; }
.pollutant { min-width: 0; text-align: center; }
.pollutant-name { display: block; font-size: 9px; color: var(--muted); white-space: nowrap; }
.pollutant-value { display: block; margin-top: 2px; font-size: 11px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.air-advice { margin-top: 7px; font-size: 10px; color: var(--muted); }
.forecast { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; }
.day { min-width: 0; padding: 3px 2px; text-align: center; }
.day-name { font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.day canvas { display: block; width: 36px; height: 36px; margin: 2px auto; }
.day-text { min-height: 15px; font-size: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.day-temp { font-size: 11px; white-space: nowrap; }
.empty { padding: 9px 0; font-size: 11px; color: var(--muted); }
footer { display: flex; justify-content: flex-end; gap: 5px; margin-top: 10px; font-size: 9px; color: var(--muted); }
footer .source-list { max-width: 68%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
[hidden] { display: none !important; }
@media (max-width: 520px) {
  #weather { padding-left: 14px; padding-right: 14px; }
  .location-row { flex-wrap: wrap; }
  .provider-state { width: calc(100% - 17px); margin-left: 17px; }
  .current-grid { grid-template-columns: 76px minmax(90px, 1fr) minmax(64px, auto); column-gap: 9px; }
  #current-icon { width: 76px; height: 76px; }
  .temperature { font-size: 43px; }
  .temperature small { font-size: 19px; }
  .condition { font-size: 16px; }
  .details { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .detail:last-child { grid-column: span 2; }
  .hourly { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  .air-grid { grid-template-columns: 78px 1fr; gap: 7px; }
  .pollutants { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .forecast { grid-template-columns: repeat(5, minmax(58px, 1fr)); overflow-x: auto; }
  footer { justify-content: flex-start; flex-wrap: wrap; }
  footer .source-list { max-width: 100%; width: 100%; }
}
@media (prefers-color-scheme: dark) {
  :root {
    --text: #f1f3f4;
    --muted: #b8bdc7;
    --line: rgba(255, 255, 255, .15);
    --surface: rgba(27, 30, 34, .58);
    --surface-strong: rgba(34, 38, 43, .84);
    --blue: #70b7ef;
    --cyan: #65c8cf;
    --green: #77c587;
    --amber: #e5b455;
    --orange: #f39a72;
    --red: #ff8a80;
  }
}
</style>
</head>
<body>
<main id="weather" aria-live="polite">
  <header>
    <div class="location-row">
      <span class="location-mark" aria-hidden="true"></span>
      <span class="location" id="location">Weather</span>
      <span class="resolved muted" id="resolved"></span>
      <span class="provider-state" id="provider-state"></span>
    </div>
    <div class="alerts" id="alerts" hidden></div>
    <div class="current-grid">
      <canvas id="current-icon" width="96" height="96"></canvas>
      <div class="temperature"><span id="temperature">--</span><small id="unit">&#176;C</small></div>
      <div class="condition-wrap">
        <div class="condition" id="condition">Loading...</div>
        <div class="updated muted" id="updated"></div>
      </div>
    </div>
    <div class="details">
      <div class="detail"><span class="detail-label" id="feels-label">Feels like</span><span class="detail-value" id="feels">--</span></div>
      <div class="detail"><span class="detail-label" id="humidity-label">Humidity</span><span class="detail-value" id="humidity">--</span></div>
      <div class="detail"><span class="detail-label" id="wind-label">Wind</span><span class="detail-value" id="wind">--</span></div>
      <div class="detail"><span class="detail-label" id="precip-label">Precipitation</span><span class="detail-value" id="precip">--</span></div>
      <div class="detail"><span class="detail-label" id="visibility-label">Visibility</span><span class="detail-value" id="visibility">--</span></div>
    </div>
  </header>

  <section class="section" id="minute-section" hidden>
    <div class="section-title-row"><span class="section-title" id="minute-title">Next 2 hours</span><span class="section-note" id="minute-updated"></span></div>
    <div class="minute-summary" id="minute-summary"></div>
    <div class="minute-chart" id="minute-chart"></div>
    <div class="minute-axis" id="minute-axis"></div>
  </section>

  <section class="section" id="hourly-section">
    <div class="section-title-row"><span class="section-title" id="hourly-title">24-hour forecast</span><span class="section-note" id="hourly-note"></span></div>
    <div class="hourly" id="hourly"></div>
  </section>

  <section class="section" id="air-section" hidden>
    <div class="section-title-row"><span class="section-title" id="air-title">Air quality</span><span class="section-note" id="air-note"></span></div>
    <div class="air-grid">
      <div class="aqi-main"><div class="aqi-value" id="aqi-value">--</div><div class="aqi-category" id="aqi-category"></div></div>
      <div class="pollutants" id="pollutants"></div>
    </div>
    <div class="air-advice" id="air-advice"></div>
  </section>

  <section class="section" id="daily-section">
    <div class="section-title-row"><span class="section-title" id="daily-title">5-day forecast</span><span class="section-note" id="daily-note"></span></div>
    <div class="forecast" id="forecast"></div>
  </section>

  <footer>
    <span id="powered-by"></span>
    <span class="source-list" id="source-list"></span>
  </footer>
</main>
<script>
(function() {
'use strict';
/*__EP_WEATHER_DATA__*/

})();
</script>
</body>
</html>
